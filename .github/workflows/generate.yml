name: Generate dictionary

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_short: ${{ steps.metadata.outputs.source_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run check

      - name: Fetch yaml-yugi
        id: source
        run: |
          source_directory="${RUNNER_TEMP}/yaml-yugi"
          source_ref="$(./scripts/fetch-yaml-yugi.sh "${source_directory}" | tail -n 1)"
          echo "directory=${source_directory}" >> "${GITHUB_OUTPUT}"
          echo "ref=${source_ref}" >> "${GITHUB_OUTPUT}"

      - name: Generate dictionary
        run: |
          pnpm exec tsx src/generate.ts \
            --input "${{ steps.source.outputs.directory }}/data/cards" \
            --msime-output dist/yugi-dict-msime.txt \
            --atok-output dist/yugi-dict-atok.txt \
            --manifest dist/manifest.json \
            --source-ref "${{ steps.source.outputs.ref }}"

      - name: Verify generated files
        run: pnpm exec tsx scripts/verify-dist.ts dist

      - name: Build release metadata
        id: metadata
        shell: bash
        run: |
          source_short="${{ steps.source.outputs.ref }}"
          source_short="${source_short:0:12}"
          generator_short="${GITHUB_SHA:0:12}"
          echo "source_short=${source_short}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=data-${source_short}-${generator_short}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yugi-dict-${{ steps.source.outputs.ref }}
          path: |
            dist/yugi-dict-msime.txt
            dist/yugi-dict-atok.txt
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: yugi-dict-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHORT: ${{ needs.build.outputs.source_short }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Yu-Gi-Oh! dictionaries ${SOURCE_SHORT}" \
              --notes "yaml-yugi ${SOURCE_SHORT} から生成したMicrosoft IME・ATOK用辞書です。"
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/yugi-dict-msime.txt \
            dist/yugi-dict-atok.txt \
            dist/manifest.json \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
          gh release edit "${RELEASE_TAG}" --latest --repo "${GITHUB_REPOSITORY}"
